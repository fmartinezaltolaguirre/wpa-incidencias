name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Git whitespace
        run: git diff --check HEAD^ HEAD

      - name: Show repository structure
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      # TODO: add application-specific steps when the local project is pushed:
      # - install dependencies
      # - lint
      # - unit/integration tests
      # - build/package
